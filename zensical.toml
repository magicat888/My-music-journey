[project]
site_name = "My Music Journey"
site_url = "https://magicat888.github.io/My-music-journey/"
site_description = "Documenting my music journey — instruments, practice logs, and discoveries"
site_author = "magicat"
repo_url = "https://github.com/magicat888/My-music-journey"
repo_name = "magicat888/My-music-journey"
copyright = "&copy; 2026 My Music Journey"

[theme]
name = "material"
variant = "modern"
language = "en"
features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.expand",
    "navigation.top",
    "search.suggest",
    "search.highlight",
    "content.code.copy",
]

[theme.palette]
primary = "deep-purple"
accent = "amber"

[theme.icon]
repo = "fontawesome/brands/github"

[navigation]
items = [
    { title = "Home", path = "index.md" },
    { title = "Getting Started", path = "getting-started.md" },
    { title = "Repertoire", children = [
        { title = "Prokofiev Sonata No. 1", path = "repertoire/prokofiev-sonata-1.md" },
        { title = "Prokofiev Sonata No. 2", path = "repertoire/prokofiev-sonata-2.md" },
    ]},
    { title = "Practice Log", path = "practice-log.md" },
    { title = "Resources", path = "resources.md" },
]

[plugins]
search = {}

[markdown]
extensions = ["admonition", "codehilite", "toc"]

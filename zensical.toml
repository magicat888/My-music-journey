[project]
site_name = "My Music Journey"
site_url = "https://magicat888.github.io/My-music-journey/"
site_description = "Documenting my music journey — Prokofiev, Mahler, Wagner, HKPO concerts, and more"
site_author = "Felix Fung"
repo_url = "https://github.com/magicat888/My-music-journey"
repo_name = "magicat888/My-music-journey"
copyright = "Copyright &copy; 2024 Felix Fung"
extra_css = ["overrides/extra.css", "overrides/theme-chooser.css"]
extra_javascript = ["overrides/theme-chooser.js"]

[project.theme]
name = "material"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[navigation]
items = [
    { title = "Home", path = "index.md" },
    { title = "Prokofiev", children = [
        { title = "Sonatas", path = "Prokofiev/Sonata/index.md" },
        { title = "Sonata No. 1", path = "Prokofiev/Sonata/Sonata 1/Sonata1.md" },
        { title = "Sonata No. 1 — Listening", path = "Prokofiev/Sonata/Sonata 1/Sonata1Listense.md" },
